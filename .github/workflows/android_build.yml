name: Android CI Build & Publish

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure Release Keystore
      run: |
        mkdir -p keystore
        if [ -f keystore/release.keystore ]; then
          echo "Testing existing keystore compatibility..."
          if ! keytool -list -keystore keystore/release.keystore -storepass edutrace123 -alias edutrace > /dev/null 2>&1; then
            echo "Keystore invalid or incompatible, generating with runner keytool..."
            rm -f keystore/release.keystore
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias edutrace \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass edutrace123 \
              -keypass edutrace123 \
              -dname "CN=EduTrace, OU=EduTrace, O=EduTrace, L=City, S=State, C=US"
          else
            echo "Keystore verified successfully."
          fi
        else
          echo "Generating release keystore..."
          keytool -genkeypair -v \
            -keystore keystore/release.keystore \
            -alias edutrace \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass edutrace123 \
            -keypass edutrace123 \
            -dname "CN=EduTrace, OU=EduTrace, O=EduTrace, L=City, S=State, C=US"
        fi

    - name: Determine Release Version
      id: version
      run: |
        BASE_VERSION=$(grep -oE 'versionName.*"([^"]+)"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$BASE_VERSION" ]; then
          BASE_VERSION="1.0"
        fi
        BUILD_NUMBER="${{ github.run_number }}"
        FULL_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
        TAG_NAME="v${FULL_VERSION}"
        echo "version_name=${FULL_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "Release Version: ${FULL_VERSION} (Tag: ${TAG_NAME})"

    - name: Build Signed Release APK
      run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

    - name: Verify APK Signature
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ -f "$APK_PATH" ]; then
          echo "Found signed release APK, verifying signature..."
          $ANDROID_HOME/build-tools/33.0.1/apksigner verify --verbose --print-certs "$APK_PATH" || true
        else
          echo "Warning: $APK_PATH not found"
        fi

    - name: Prepare Release APK Packages
      run: |
        cp app/build/outputs/apk/release/app-release.apk "EduTrace-${{ steps.version.outputs.tag_name }}.apk"
        cp app/build/outputs/apk/release/app-release.apk "EduTrace-release.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EduTrace-${{ steps.version.outputs.tag_name }}
        path: |
          EduTrace-${{ steps.version.outputs.tag_name }}.apk
          EduTrace-release.apk
          app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.version.outputs.tag_name }}
        name: "EduTrace ${{ steps.version.outputs.tag_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          EduTrace-${{ steps.version.outputs.tag_name }}.apk
          EduTrace-release.apk
          app/build/outputs/apk/release/app-release.apk
