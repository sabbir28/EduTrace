name: Android CI Build & Publish

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Determine Release Version
      id: version
      run: |
        BASE_VERSION=$(grep -oE 'versionName.*"([^"]+)"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$BASE_VERSION" ]; then
          BASE_VERSION="1.0"
        fi
        BUILD_NUMBER="${{ github.run_number }}"
        FULL_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
        TAG_NAME="v${FULL_VERSION}"
        echo "version_name=${FULL_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "Release Version: ${FULL_VERSION} (Tag: ${TAG_NAME})"

    - name: Build Android APKs
      run: ./gradlew assembleDebug assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

    - name: Verify Signatures and Package Verified APKs
      run: |
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
        if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
          echo "::error::apksigner not found in $BUILD_TOOLS_DIR"
          exit 1
        fi

        mkdir -p verified_apks
        TAG="${{ steps.version.outputs.tag_name }}"

        echo "### Verified APK Signatures" >> $GITHUB_STEP_SUMMARY
        echo "| Package | Status | Signer DN | SHA-256 Digest |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

        verify_and_stage() {
          local apk_path="$1"
          local apk_type="$2"

          if [ ! -f "$apk_path" ]; then
            echo "::warning::File $apk_path not found"
            return 0
          fi

          echo "=============================================="
          echo "Verifying $apk_type APK: $apk_path"
          echo "=============================================="

          if "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$apk_path"; then
            echo "SUCCESS: $apk_type APK verified successfully!"
            
            CERT_INFO=$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$apk_path")
            SIGNER_DN=$(echo "$CERT_INFO" | grep "certificate DN:" | head -n 1 | sed 's/.*certificate DN: //')
            SHA256=$(echo "$CERT_INFO" | grep "certificate SHA-256 digest:" | head -n 1 | sed 's/.*certificate SHA-256 digest: //')

            echo "| **EduTrace-${apk_type}.apk** | Passed | \`${SIGNER_DN}\` | \`${SHA256:0:16}...\` |" >> $GITHUB_STEP_SUMMARY

            cp "$apk_path" "verified_apks/EduTrace-${TAG}-${apk_type}.apk"
            cp "$apk_path" "verified_apks/EduTrace-${apk_type}.apk"
          else
            echo "::error::$apk_type APK verification FAILED! This APK will NOT be published."
            echo "| **EduTrace-${apk_type}.apk** | FAILED | N/A | N/A |" >> $GITHUB_STEP_SUMMARY
          fi
        }

        verify_and_stage "app/build/outputs/apk/release/app-release.apk" "release"
        verify_and_stage "app/build/outputs/apk/debug/app-debug.apk" "debug"

        VERIFIED_COUNT=$(find verified_apks -type f -name "*.apk" | wc -l)
        if [ "$VERIFIED_COUNT" -eq 0 ]; then
          echo "::error::No APK passed verification! Stopping workflow."
          exit 1
        fi

        # Build OBB expansion pack containing dynamic content (quotes, templates)
        echo "Building OBB asset expansion pack..."
        mkdir -p obb_staging
        cp app/src/main/assets/quotes_*.json obb_staging/
        echo "{\"version\": \"${{ steps.version.outputs.version_name }}\", \"name\": \"EduTrace Content Pack\"}" > obb_staging/pack_manifest.json
        (cd obb_staging && zip -r ../verified_apks/EduTrace-assets.obb .)
        cp verified_apks/EduTrace-assets.obb "verified_apks/main.${{ steps.version.outputs.version_code }}.org.sabbir.edutrace.obb"

        echo "Staged verified APK packages and OBB expansion packs for release:"
        ls -lh verified_apks/

    - name: Upload Verified APK and OBB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EduTrace-${{ steps.version.outputs.tag_name }}
        path: verified_apks/*
        if-no-files-found: error

    - name: Publish Verified APKs and OBB to GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.version.outputs.tag_name }}
        name: "EduTrace ${{ steps.version.outputs.tag_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        overwrite_files: true
        files: verified_apks/*
