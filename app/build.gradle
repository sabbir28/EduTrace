plugins {
    id 'com.android.application'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "org.sabbir.edutrace"
        minSdk 21
        targetSdk 33
        versionCode Integer.parseInt(String.valueOf(project.findProperty('versionCode') ?: 1))
        versionName String.valueOf(project.findProperty('versionName') ?: "1.0")

    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file("keystore/release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword (project.findProperty("KEYSTORE_PASSWORD") ?: "edutrace123").toString()
                keyAlias (project.findProperty("KEY_ALIAS") ?: "edutrace").toString()
                keyPassword (project.findProperty("KEY_PASSWORD") ?: "edutrace123").toString()
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def room_version = "2.4.3"
    def lifecycle_version = "2.5.1"

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.work:work-runtime:2.7.1"
    implementation 'androidx.core:core-splashscreen:1.0.0'
}